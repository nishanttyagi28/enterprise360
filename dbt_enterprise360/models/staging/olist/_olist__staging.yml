version: 2
models:
  - name: stg_olist__orders
    description: One row per order. Typed timestamps; status lower-cased.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: purchased_at
        tests: [not_null]
      - name: order_status
        tests:
          - accepted_values:
              values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
  - name: stg_olist__customers
    description: One row per customer_id (Olist issues a new customer_id per order; the person is customer_unique_id).
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_unique_id
        tests: [not_null]
      - name: customer_state
        tests:
          - accepted_values:
              values: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
  - name: stg_olist__order_items
    description: One row per order line; each line is one unit (quantity is expressed by repeated rows).
    tests:
      - dbt_utils.unique_combination_of_columns: {combination_of_columns: [order_id, order_item_id]}
    columns:
      - name: shipping_limit_at
        description: Seller SLA deadline to hand the item to the carrier (source shipping_limit_date).
        tests: [not_null]
      - name: item_price
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0}
      - name: freight_value
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0}
  - name: stg_olist__order_payments
    tests:
      - dbt_utils.unique_combination_of_columns: {combination_of_columns: [order_id, payment_sequential]}
    columns:
      - name: payment_type
        tests:
          - accepted_values: {values: [credit_card, boleto, voucher, debit_card, not_defined]}
      - name: payment_value
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0}
  - name: stg_olist__order_reviews
    tests:
      - dbt_utils.unique_combination_of_columns: {combination_of_columns: [review_id, order_id]}
    columns:
      - name: review_score
        tests:
          - not_null
          - accepted_values: {values: [1, 2, 3, 4, 5], quote: false}
  - name: stg_olist__products
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: stg_olist__category_translation
    columns:
      - name: category_name_pt
        tests: [unique, not_null]
  - name: stg_olist__sellers
    columns:
      - name: seller_id
        tests: [unique, not_null]
  - name: stg_olist__geolocation
    columns:
      - name: zip_prefix
        tests: [not_null]
