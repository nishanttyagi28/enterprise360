version: 2
models:
  - name: int_uci__invoice_lines_classified
    columns:
      - name: line_type
        tests:
          - accepted_values:
              values: [product, postage, manual, discount, sample, fee, adjustment, bad_debt, test, voucher, stock_writeoff, zero_price]
  - name: int_uci__product_descriptions
    tests:
      - dbt_utils.unique_combination_of_columns: {combination_of_columns: [stock_code, description]}
  - name: int_uci__month_coverage
    columns:
      - name: month_start
        tests: [unique, not_null]
  - name: int_uci__dedup_stats
    columns:
      - name: check_name
        tests: [unique, not_null]
