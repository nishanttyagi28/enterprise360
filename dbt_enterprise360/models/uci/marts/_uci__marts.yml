version: 2
models:
  - name: uci_mart_sales_daily
    description: "Daily UCI sales (GBP). net_sales_proxy_gbp = Net Sales (proxy): product lines + cancellations + discounts. Not accounting value."
    columns:
      - name: date_key
        tests: [unique, not_null]
  - name: uci_mart_product_monthly
    tests:
      - dbt_utils.unique_combination_of_columns: {combination_of_columns: [month_start, uci_product_sk]}
  - name: uci_mart_country_monthly
    tests:
      - dbt_utils.unique_combination_of_columns: {combination_of_columns: [month_start, uci_country_sk]}
  - name: uci_mart_customer_cohorts
    tests:
      - dbt_utils.unique_combination_of_columns: {combination_of_columns: [cohort_month, months_since_first_purchase]}
    columns:
      - name: retention_rate
        tests: [{dbt_utils.accepted_range: {min_value: 0, max_value: 1}}]
  - name: uci_mart_customer_rfm
    columns:
      - name: customer_id
        tests: [unique, not_null]
