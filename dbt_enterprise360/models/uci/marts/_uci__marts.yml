version: 2
models:
  - name: uci_mart_sales_daily
    description: "Daily UCI sales (GBP). net_sales_proxy_gbp = Net Sales (proxy): product lines + cancellations + discounts. Not accounting value."
    columns:
      - name: date_key
        tests: [unique, not_null]
      - name: net_sales_proxy_gbp
        description: AOV numerator (additive; sum it for any rollup).
      - name: sales_invoice_count
        description: Sales (non-cancellation) invoices; AOV denominator (additive). Same value as sales_invoices.
      - name: aov_gbp
        description: >-
          KPI_UCI_AOV = net_sales_proxy_gbp / sales_invoice_count for the day. NON-ADDITIVE: monthly or any
          other rollup must be recomputed as sum(net_sales_proxy_gbp) / sum(sales_invoice_count); never sum or
          average daily aov_gbp.
      - name: gross_product_value_per_product_invoice_gbp
        description: Previous aov_gbp definition, kept for reference (gross product sales / non-C invoices with at least one product line). Not the AOV KPI.
  - name: uci_mart_product_monthly
    tests:
      - dbt_utils.unique_combination_of_columns: {combination_of_columns: [month_start, uci_product_sk]}
  - name: uci_mart_country_monthly
    tests:
      - dbt_utils.unique_combination_of_columns: {combination_of_columns: [month_start, uci_country_sk]}
  - name: uci_mart_customer_cohorts
    tests:
      - dbt_utils.unique_combination_of_columns: {combination_of_columns: [cohort_month, months_since_first_purchase]}
    columns:
      - name: retention_rate
        tests: [{dbt_utils.accepted_range: {min_value: 0, max_value: 1}}]
  - name: uci_mart_customer_rfm
    columns:
      - name: customer_id
        tests: [unique, not_null]
