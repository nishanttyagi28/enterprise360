# In-repo profile (use --profiles-dir .). Credentials ONLY via env vars, which the wrappers
# (scripts/run.ps1, Makefile, python -m orchestration.dbt_runner) load from the repo .env.
enterprise360:
  target: "{{ env_var('E360_DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('POSTGRES_DB', 'enterprise360') }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      schema: core
      threads: "{{ env_var('E360_DBT_THREADS', '4') | as_number }}"
      connect_timeout: 10
      keepalives_idle: 0
