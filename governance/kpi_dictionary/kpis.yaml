    pr: TBD
  - version: 1.2.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Primary source core.dq_run_summary; strict definition (warn=not-pass, skipped=fail, block=3/warn=1, latest run)
    pr: TBD
  implementations:
