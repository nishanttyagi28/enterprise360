- id: KPI_REVIEW_SCORE
  name: Average Review Score
  status: SUPPORTED
  definition: Mean review score (1–5) using latest review per order. Proxy for satisfaction; not surveyed CSAT.
  formula: AVG(review_score) over int_olist__order_review_latest
  numerator: Σ score
  denominator: orders reviewed
