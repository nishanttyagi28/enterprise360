- id: KPI_GMV_FORECAST
  name: GMV Forecast (exploratory)
  status: PARTIAL
  area: forecasting
  definition: 'Exploratory model-based MONTHLY forecast of KPI_GMV (SUM item_price, freight excluded; NOT revenue), horizon 6 months (2018-09..2019-02). Trained only on months with is_complete_month AND is_reporting_month (2017-01..2018-08, 20 months; source marts.mart_business_overview_monthly, actuals reconcile to fct_order_items with 0.00 difference). Method: ETS candidates Holt damped additive trend vs SES, selected on validation sMAPE (holt_damped selected); baseline naive_last_value (seasonal naive infeasible, < 2 years). Backtest (run 7476f047, 3 points per split, monthly): VALIDATION model holt_damped MAE 60,295 BRL / sMAPE 5.80% vs naive_last_value MAE 147,948 / sMAPE 16.11%; TEST model MAE 287,398 / sMAPE 28.25% vs baseline MAE 124,745 / sMAPE 13.37%. The selected model does NOT beat the naive baseline on the test holdout.'
  formula: forecast_gmv = ETS(A,Ad,N) refit on all 20 usable months; compare to baseline_gmv (last value); sMAPE = mean(2|a-f|/(|a|+|f|))
  numerator: —
  denominator: —
  unit: BRL
  source:
  - olist_order_items.price
  - olist_orders.order_purchase_timestamp
  source_tag: PROPOSED — pending DE commit (marts.mart_gmv_forecast, marts.mart_gmv_anomalies, marts.mart_gmv_forecast_backtest built from analytics.forecast_* run 7476f047 on 2026-10-30 20:31 UTC; SQL/Python uncommitted on 2026-10-31)
  fact_dependencies:
  - fct_order_items
  - marts.mart_business_overview_monthly
  - marts.mart_gmv_forecast
  - marts.mart_gmv_forecast_backtest
  dimension_dependencies:
  - dim_date
  grain: month (forecast_month), latest successful run only
  refresh: daily batch after ingestion + dbt build (static historical dataset)
  owner: Head of Sales
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - 'split: train 2017-01..2018-02 (14) | validation 2018-03..2018-05 (3, fit on train) | test 2018-06..2018-08 (3, fit on train+validation) | forecast 2018-09..2019-02 (6, refit on all)'
  - no validation/test/forecast row at or before its training_cutoff (assert_forecast_no_train_test_overlap)
  - forecast_month unique and contiguous
  - backtest has selected model and naive baseline per series x split
  - WARN if selected model sMAPE >= baseline on test (assert_forecast_model_beats_baseline; currently WARN)
  - actual_gmv == mart_business_overview_monthly.gmv == SUM(fct_order_items.item_price) by month (0.00)
  - cite accuracy only from mart_gmv_forecast_backtest; label 'backtest, 3 months'
  supporting_measures:
  - measure: '[GMV Forecast Lower/Upper]'
    kind: formatting
    purpose: 95% model-based prediction interval (ETS analytic; lower clipped at 0) from lower_gmv/upper_gmv; label as model-based, not a guarantee
  - measure: '[GMV Baseline (Naive)]'
    kind: breakdown
    purpose: baseline_gmv, last observed value; shown alongside the forecast
  caveats:
  - Exploratory; not a KPI of record; GMV not revenue.
  - 'Backtest (run 7476f047, 3 points per split, monthly): VALIDATION model holt_damped MAE 60,295 BRL / sMAPE 5.80% vs naive_last_value MAE 147,948 / sMAPE 16.11%; TEST model MAE 287,398 / sMAPE 28.25% vs baseline MAE 124,745 / sMAPE 13.37%. The selected model does NOT beat the naive baseline on the test holdout.'
  - Metrics are on 3 points per split; not statistically meaningful. Model selection was done on 3 validation months.
  - 'All 3 test actuals (Jun–Aug 2018: 865,124 / 895,507 / 854,686) fall BELOW the 95% interval lower bounds (932,111 / 977,905 / 1,021,685): intervals are under-dispersed / not calibrated.'
  - Damped trend extrapolates growth (forecast 939k rising to 1.03M) while Jun–Aug 2018 actuals declined; forecast months 2018-09..2019-02 have no actuals (dataset ends) and cannot be verified.
  - Train rows carry in-sample fitted values in forecast_gmv; never plot them as a forecast.
  - Only 20 usable months; Black Friday Nov 2017 (1.01M) dominates; no yearly seasonality modelled.
  version: 1.0.1
  change_log:
  - version: 1.0.0
