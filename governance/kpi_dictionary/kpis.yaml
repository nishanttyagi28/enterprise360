- id: KPI_DQ_SCORE
  name: Data Quality Score
  status: SUPPORTED
  definition: 'Strict severity-weighted DQ score for a dbt run: only status ''pass'' earns weight; ''warn'' counts as not-pass (earns 0); skipped counts as fail. Weights: block=3, warn=1 (dq_check_config
    default). Default view = latest run (is_latest_run).'
  formula: Σ(weight where status='pass') / Σ(weight)
  numerator: Σ weight of passed checks
  denominator: Σ weight of all executed checks
  unit: percent
  source:
  - core.dq_run_summary (primary, one row per run_id)
  - core.dq_results (check-level detail)
  source_tag: CONFIRMED (Olist columns from CSV headers; dbt model/column names verified against dbt_enterprise360/models on 2026-10-30)
  fact_dependencies:
  - core.dq_run_summary
  - core.dq_results
  dimension_dependencies:
  - dim_date
  grain: run_id
  refresh: daily batch after ingestion + dbt build
  owner: Data Platform Lead
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - 'core.dq_run_summary.dq_score == Σ(pass×weight)/Σ(weight) over core.dq_results for the same run_id (verified 2026-10-30 latest run: 505/506 = 0.9980)'
  - warn earns 0; skipped → fail
  - default filter is_latest_run = true
  - weights block=3, warn=1 unless overridden in dq_check_config
  version: 1.2.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
