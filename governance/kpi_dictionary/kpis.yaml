  domain: olist
- id: KPI_AOV
  name: Average Order Value
  status: SUPPORTED
  definition: Item GMV per order that has at least one item.
  formula: KPI_GMV / COUNT(DISTINCT order_id with items)
  numerator: KPI_GMV
  denominator: orders with ≥1 item
  unit: BRL
  source:
  - olist_order_items
  source_tag: CONFIRMED (Olist columns from CSV headers; dbt model/column names verified against dbt_enterprise360/models on 2026-10-30)
  fact_dependencies:
  - fct_order_items
  dimension_dependencies: *id001
  grain: order (non-additive)
  refresh: daily batch after ingestion + dbt build
  owner: Head of Sales
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - ratio of sums; never average of AOVs
  - denominator excludes orders with no items (e.g. some canceled/unavailable)
  version: 1.1.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
    pr: TBD
  - version: 1.1.0
    date: '2026-10-30'
    author: KPI & Quality
    change: names confirmed vs DE models; payments exception counts; GMV growth uses is_complete_month
    pr: TBD
  implementations:
    dbt: fct_order_items; order grain via int_olist__order_items_aggregated (from int_olist__order_items_enriched)
    sql: dbt_enterprise360/analyses/kpi_aov.sql (reconciliation reference only)
    power_bi_dax: '[AOV]'
    streamlit: app/services/kpis.py → reads dbt mart; no recomputation
  domain: olist
- id: KPI_ITEMS_PER_ORDER
  name: Items per Order
  status: SUPPORTED
  definition: Average order lines (=units; one row per unit in Olist) per order with items.
  formula: COUNT(order lines)/COUNT(DISTINCT order_id)
  numerator: order lines
  denominator: orders with items
  unit: ratio
  source:
  - olist_order_items
  source_tag: CONFIRMED (Olist columns from CSV headers; dbt model/column names verified against dbt_enterprise360/models on 2026-10-30)
  fact_dependencies:
