- id: KPI_SELLER_HANDOVER_OTD
  name: Seller Handover On-Time Rate
  status: PARTIAL
  definition: 'Share of order items handed to the carrier (fct_deliveries.delivered_carrier_at) at or before the item''s fct_order_items.shipping_limit_at, counting only items with both timestamps. PARTIAL: Olist records the carrier handover once per order, so every seller in a multi-seller order is measured against the same handover time.'
  formula: count(items where delivered_carrier_at <= shipping_limit_at) / count(items with both timestamps)
  numerator: items handed over on time
  denominator: items with both delivered_carrier_at and shipping_limit_at
  unit: percent
  source:
  - olist_order_items.shipping_limit_date
  - olist_orders.order_delivered_carrier_date
  source_tag: PROPOSED (Olist columns CONFIRMED FACT; dbt names confirmed in fct_order_items and fct_deliveries)
  fact_dependencies:
  - fct_order_items
  - fct_deliveries
  dimension_dependencies:
  - dim_date
  - dim_seller
  - dim_product
  grain: order item
  refresh: daily batch after ingestion + dbt build
  owner: Head of Operations
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - exclude items missing either timestamp (count separately as DQ)
  - flag multi-seller orders; seller-level values for them share one order-level handover time
  - shipping_limit_at is Olist's seller deadline, not a contractual SLA
  - timestamp comparison, not date-only
  version: 1.0.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Added at Power BI's request as an item-grain seller handover measure
    pr: TBD
  implementations:
    dbt: fct_order_items.shipping_limit_at joined to fct_deliveries.delivered_carrier_at on order_id (no fan-out, deliveries is one row per order)
    sql: dbt_enterprise360/analyses/kpi_seller_handover_otd.sql (reconciliation reference only)
    power_bi_dax: '[Seller Handover On-Time %]'
    streamlit: app/services/kpis.py → reads dbt mart; no recomputation
