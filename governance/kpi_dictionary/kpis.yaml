- id: KPI_GMV_GROWTH
  name: GMV Growth %
  status: PARTIAL
  definition: 'Month-over-month change in KPI_GMV (calendar month, purchase date). Named GMV growth, not revenue growth. PARTIAL: first/last coverage months are partial and sparse; return blank when either month is partial or prior GMV is 0.'
  formula: (GMV_t − GMV_t−1)/GMV_t−1
