dataset: Olist Brazilian E-Commerce Public Dataset (Kaggle olistbr/brazilian-ecommerce)
currency: BRL
filter_behaviour_notes:
- id: FBN_ORDER_LEVEL_UNDER_LINE_FILTERS
  title: Order-level KPIs under Product or Seller filters
  applies_to:
  - KPI_ORDERS
  - KPI_OTD_RATE
  - KPI_DELIVERY_DAYS
  - KPI_REVIEW_SCORE
  - KPI_APPROVAL_HOURS
  note: Under a product, category or seller filter, order-level KPIs (Orders, OTD %, Avg Delivery Days, Avg Review Score, Avg Approval Hours) count orders containing a matching line. Multi-category or multi-seller
    orders count once per category or seller, so totals across categories/sellers are not additive and none are shown implying additivity. Review score by category is 'Avg Review Score of orders containing
    category', not a product rating.
kpis:
- id: KPI_GMV
  name: Gross Merchandise Value
  status: SUPPORTED
  definition: Sum of item price over all order lines of orders in scope (all statuses). EXCLUDES freight. GMV is NOT recognized revenue (no invoicing/revenue-recognition, refunds, tax or returns ledger
    in Olist).
  formula: SUM(fct_order_items.item_price)
  numerator: —
  denominator: —
  unit: BRL
  source:
  - olist_order_items.price
  source_tag: CONFIRMED (Olist columns from CSV headers; dbt model/column names verified against dbt_enterprise360/models on 2026-10-30)
  fact_dependencies:
  - fct_order_items
  dimension_dependencies: &id001
  - dim_date
  - dim_customer
  - dim_product
  - dim_seller
  - dim_geography
  grain: order line (order_id, order_item_id)
  refresh: daily batch after ingestion + dbt build
  owner: Head of Sales
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - GMV must never be named or labelled 'Revenue' in any model, measure or visual
  - GMV >= KPI_NET_GMV for every period
  - sum(fct_order_items.item_price) == sum(stg_olist__order_items.item_price) (tolerance 0)
  - freight excluded; see KPI_GMV_INCL_FREIGHT
  - fct_orders item rollup == fct_order_items (assert_recon_fct_orders_items_rollup)
  version: 1.1.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
    pr: TBD
  - version: 1.1.0
    date: '2026-10-30'
    author: KPI & Quality
    change: names confirmed vs DE models; payments exception counts; GMV growth uses is_complete_month
    pr: TBD
  implementations:
    dbt: fct_order_items.item_price; order grain via int_olist__order_items_aggregated (from int_olist__order_items_enriched)
    sql: dbt_enterprise360/analyses/kpi_gmv.sql (reconciliation reference only)
    power_bi_dax: '[GMV]'
    streamlit: app/services/kpis.py → reads dbt mart; no recomputation
  domain: olist
- id: KPI_GMV_INCL_FREIGHT
  name: GMV incl. Freight
  status: SUPPORTED
  definition: Item price + customer-charged freight. Not revenue.
  formula: SUM(item_price + freight_value)
  numerator: —
  denominator: —
  unit: BRL
  source:
  - olist_order_items.price
  - olist_order_items.freight_value
  source_tag: CONFIRMED (Olist columns from CSV headers; dbt model/column names verified against dbt_enterprise360/models on 2026-10-30)
  fact_dependencies:
  - fct_order_items
  dimension_dependencies: *id001
  grain: order line
  refresh: daily batch after ingestion + dbt build
  owner: Head of Sales
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - == KPI_GMV + KPI_FREIGHT (tolerance 0.00)
  version: 1.1.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
    pr: TBD
  - version: 1.1.0
    date: '2026-10-30'
    author: KPI & Quality
    change: names confirmed vs DE models; payments exception counts; GMV growth uses is_complete_month
    pr: TBD
  implementations:
    dbt: fct_order_items
    sql: dbt_enterprise360/analyses/kpi_gmv_incl_freight.sql (reconciliation reference only)
    power_bi_dax: '[GMV incl Freight]'
    streamlit: app/services/kpis.py → reads dbt mart; no recomputation
  domain: olist
- id: KPI_NET_GMV
  name: Net GMV (excl. canceled/unavailable)
  status: SUPPORTED
  definition: GMV of orders whose status is not canceled/unavailable. Operational proxy; NOT net revenue (no returns/refund data).
  formula: SUM(item_price) WHERE order_status NOT IN ('canceled','unavailable')
  numerator: —
  denominator: —
  unit: BRL
  source:
  - olist_order_items.price
  - olist_orders.order_status
  source_tag: CONFIRMED (Olist columns from CSV headers; dbt model/column names verified against dbt_enterprise360/models on 2026-10-30)
  fact_dependencies:
  - fct_order_items
  - fct_orders
  dimension_dependencies: *id001
  grain: order line
  refresh: daily batch after ingestion + dbt build
  owner: Head of Sales
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - <= KPI_GMV
  - label must say 'Net GMV' not 'Net Revenue'
  version: 1.1.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
    pr: TBD
  - version: 1.1.0
    date: '2026-10-30'
    author: KPI & Quality
    change: names confirmed vs DE models; payments exception counts; GMV growth uses is_complete_month
    pr: TBD
  implementations:
    dbt: fct_order_items + fct_orders.is_canceled; order grain via int_olist__order_items_aggregated (from int_olist__order_items_enriched)
    sql: dbt_enterprise360/analyses/kpi_net_gmv.sql (reconciliation reference only)
    power_bi_dax: '[Net GMV]'
    streamlit: app/services/kpis.py → reads dbt mart; no recomputation
  domain: olist
