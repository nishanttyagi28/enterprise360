- id: KPI_AOV
  name: Average Order Value
  status: SUPPORTED
  definition: Item GMV per order that has at least one item.
  formula: KPI_GMV / COUNT(DISTINCT order_id with items)
  numerator: KPI_GMV
  denominator: orders with ≥1 item
  unit: BRL
  source:
  - olist_order_items
  source_tag: CONFIRMED (Olist columns from CSV headers; dbt model/column names verified against dbt_enterprise360/models on 2026-10-30)
  fact_dependencies:
  - fct_order_items
  dimension_dependencies: *id001
  grain: order (non-additive)
  refresh: daily batch after ingestion + dbt build
  owner: Head of Sales
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - ratio of sums; never average of AOVs
  - denominator excludes orders with no items (e.g. some canceled/unavailable)
  version: 1.1.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
    pr: TBD
  - version: 1.1.0
