    change: names confirmed vs DE models; payments exception counts; GMV growth uses is_complete_month
    pr: TBD
  implementations:
    dbt: fct_order_items; order grain via int_olist__order_items_aggregated (from int_olist__order_items_enriched)
    sql: dbt_enterprise360/analyses/kpi_aov.sql (reconciliation reference only)
    power_bi_dax: '[AOV]'
