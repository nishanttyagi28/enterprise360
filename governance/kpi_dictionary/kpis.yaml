- id: KPI_REPEAT_RATE
  name: Repeat Purchase Rate
  status: SUPPORTED
  definition: Share of customers (customer_unique_id) with ≥2 distinct orders within the selected period; customers with exactly one in-period order count in the denominator even if they ordered outside
    the period. Visuals must label it 'within selected period' (lifetime repeat rate = full coverage selected).
  formula: customers with ≥2 orders / customers
  numerator: repeat customers
  denominator: customers
  unit: percent
  source:
  - olist_customers
  - olist_orders
  source_tag: CONFIRMED (Olist columns from CSV headers; dbt model/column names verified against dbt_enterprise360/models on 2026-10-30)
  fact_dependencies:
  - fct_orders
  dimension_dependencies:
  - dim_customer
  grain: customer
  refresh: daily batch after ingestion + dbt build
  owner: Head of CRM
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - report numerator & denominator with rate (low base expected; report as observed)
  version: 1.1.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
    pr: TBD
  - version: 1.1.0
    date: '2026-10-30'
    author: KPI & Quality
    change: names confirmed vs DE models; payments exception counts; GMV growth uses is_complete_month
    pr: TBD
  implementations:
    dbt: dim_customer.lifetime_orders
    sql: dbt_enterprise360/analyses/kpi_repeat_rate.sql (reconciliation reference only)
    power_bi_dax: '[Repeat Purchase Rate %]'
    streamlit: app/services/kpis.py → reads dbt mart; no recomputation
  domain: olist
- id: KPI_OTD_RATE
  name: On-Time Delivery Rate
