  domain: olist
- id: KPI_PAYMENT_VALUE
  name: Payment Value
  status: SUPPORTED
  definition: Sum of recorded payment values (all payment types incl. vouchers). Transaction value ≠ cash flow ≠ revenue.
  formula: SUM(fct_payments.payment_value)
  numerator: —
  denominator: —
  unit: BRL
  source:
  - olist_order_payments.payment_value
  source_tag: CONFIRMED (Olist columns from CSV headers; dbt model/column names verified against dbt_enterprise360/models on 2026-10-30)
  fact_dependencies:
  - fct_payments
  dimension_dependencies:
  - dim_date
  - dim_payment_type
  grain: payment (order_id, payment_sequential)
  refresh: daily batch after ingestion + dbt build
  owner: Finance
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - fct_payments never joined to fct_order_items (fan-out)
  - 'Per order: |sum(payment_value) − sum(item_price+freight_value)| > 0.01 BRL, computed in exact numeric(12,2) (never float), is WARN not fail (dbt assert_payments_vs_items_freight). Known exceptions
    on 2026-10-30 build: 1,076 orders = 772 payment_without_items, 264 overpaid (installment interest?), 39 underpaid (voucher/discount?), 1 items_without_payment. Counts logged to dq_results with kpi_id
    KPI_PAYMENT_VALUE.'
  version: 1.1.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
    pr: TBD
  - version: 1.1.0
    date: '2026-10-30'
    author: KPI & Quality
    change: names confirmed vs DE models; payments exception counts; GMV growth uses is_complete_month
    pr: TBD
  implementations:
    dbt: fct_payments.payment_value; order grain via int_olist__order_payments_aggregated → fct_orders
    sql: dbt_enterprise360/analyses/kpi_payment_value.sql (reconciliation reference only)
    power_bi_dax: '[Payment Value]'
    streamlit: app/services/kpis.py → reads dbt mart; no recomputation
  domain: olist
  supporting_measures:
  - measure: '[Payment Mix %]'
    purpose: Share of payment value by payment type; labelled payment mix, never sales
    kind: breakdown
  - measure: '[Payment Records]'
    purpose: Count of payment rows (order_id, payment_sequential)
    kind: breakdown
  - measure: '[Payment Mismatch Orders]'
    purpose: Orders with |payment − (items+freight)| > 0.01 BRL, exact numeric; currently 1,076. Payments without items drop out under product or seller filters (no item lines to match).
    kind: dq_exclusion
  - measure: '[Payment Without Items Orders]'
    purpose: Data Quality page; currently 772. Payments without items drop out under product or seller filters (no item lines to match).
    kind: dq_exclusion
  - measure: '[Overpaid Orders]'
    purpose: Data Quality page; currently 264
    kind: dq_exclusion
  - measure: '[Underpaid Orders]'
    purpose: Data Quality page; currently 39
    kind: dq_exclusion
  - measure: '[Items Without Payment Orders]'
    purpose: Data Quality page; currently 1
    kind: dq_exclusion
