  name: GMV Anomaly Flag (exploratory)
  status: PARTIAL
  area: forecasting
  definition: 'Exploratory MONTHLY flag (not daily): month flagged when robust_z = |r - median(r)| / (1.4826 × MAD(r)) > 3.5, where r = actual GMV − expected and expected = one-step-ahead in-sample fit of the selected ETS model (holt_damped) fitted on all 20 complete reporting months. Use mart_gmv_anomalies.is_gmv_anomaly (NOT is_anomaly, which ORs in the orders anomaly). Current run: 0 GMV anomaly months; Nov 2017 robust_z 2.84 (not flagged); May 2018 0.19 (not flagged).'
  formula: is_gmv_anomaly = |r - median(r)| / (1.4826 * MAD(r)) > 3.5, r = gmv - expected_gmv
  numerator: —
  denominator: —
  unit: flag (boolean)
  source:
  - olist_order_items.price
  - olist_orders.order_purchase_timestamp
  source_tag: PROPOSED — pending DE commit (marts.mart_gmv_forecast, marts.mart_gmv_anomalies, marts.mart_gmv_forecast_backtest built from analytics.forecast_* run 7476f047 on 2026-10-30 20:31 UTC; SQL/Python uncommitted on 2026-10-31)
  fact_dependencies:
  - fct_order_items
  - marts.mart_business_overview_monthly
  - marts.mart_gmv_anomalies
  dimension_dependencies:
  - dim_date
  grain: month (anomaly_date = month start), latest run only
  refresh: daily batch after ingestion + dbt build (static historical dataset)
  owner: Head of Sales
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - anomaly_date unique (assert_forecast_grain_anomalies)
  - z_threshold = 3.5 stored per row
  - 'only complete reporting months evaluated (20 rows: 2017-01..2018-08); partial 2016 months and the 2018-09/10 tail excluded'
  - GMV KPI uses is_gmv_anomaly; is_anomaly is GMV OR orders and must not be labelled a GMV anomaly
  supporting_measures:
  - measure: '[GMV Anomaly Months]'
    kind: breakdown
    purpose: count of months with is_gmv_anomaly = true (0 in run 7476f047)
  - measure: '[GMV Robust Z]'
    kind: formatting
    purpose: gmv_robust_z shown with the 3.5 threshold line
  caveats:
  - Flags are statistical, not confirmed incidents.
  - 'Monthly grain cannot isolate day events: Black Friday 2017-11-24 shows only as Nov 2017 (GMV robust_z 2.84, not flagged; orders z 5.60 flagged); truckers'' strike May 2018 not flagged (0.19).'
  - Expected comes from a model whose parameters were estimated on all months including the evaluated month (in-sample, not a centered window but not strictly out-of-sample); residual MAD is over the same 20 points.
  - With 20 points the threshold has low power; 0 flags is not evidence of no incidents.
