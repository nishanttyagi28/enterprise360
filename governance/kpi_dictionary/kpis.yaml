- id: KPI_FREIGHT_SHARE
  name: Freight Share of GMV
  status: SUPPORTED
  definition: Freight as a share of item GMV.
  formula: KPI_FREIGHT / KPI_GMV
  numerator: KPI_FREIGHT
  denominator: KPI_GMV
  unit: ratio
  source:
  - olist_order_items
  source_tag: CONFIRMED (Olist columns from CSV headers; dbt model/column names verified against dbt_enterprise360/models on 2026-10-30)
  fact_dependencies:
  - fct_order_items
  dimension_dependencies: *id001
  grain: order line (ratio of sums)
  refresh: daily batch after ingestion + dbt build
  owner: Head of Operations
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - ratio of sums; never average of line ratios
  version: 1.1.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
    pr: TBD
  - version: 1.1.0
