- id: KPI_REPEAT_RATE
  name: Repeat Purchase Rate
  status: SUPPORTED
  definition: Share of customers (customer_unique_id) with ≥2 distinct orders within the selected period; customers with exactly one in-period order count in the denominator even if they ordered outside the period. Visuals must label it 'within selected period' (lifetime repeat rate = full coverage selected).
  formula: customers with ≥2 orders / customers
  numerator: repeat customers
  denominator: customers
  unit: percent
  source:
  - olist_customers
  - olist_orders
  source_tag: PROPOSED (Olist columns CONFIRMED FACT from CSV headers; dbt names per 05 STTM, ASSUMPTION until models exist)
  fact_dependencies:
  - fct_orders
  dimension_dependencies:
  - dim_customer
  grain: customer
  refresh: daily batch after ingestion + dbt build
  owner: Head of CRM
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - report numerator & denominator with rate (low base expected; report as observed)
  version: 1.0.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
    pr: TBD
  implementations:
    dbt: dim_customer.lifetime_orders
    sql: dbt_enterprise360/analyses/kpi_repeat_rate.sql (reconciliation reference only)
    power_bi_dax: '[Repeat Purchase Rate %]'
    streamlit: app/services/kpis.py → reads dbt mart; no recomputation
- id: KPI_OTD_RATE
  name: On-Time Delivery Rate
  status: SUPPORTED
  definition: Share of OTD-eligible orders (fct_deliveries.is_otd_eligible = status delivered AND delivered_customer_at not null AND delivered_customer_at >= purchased_at) whose delivered_customer_at date <= estimated_delivery_at date. Default date role is purchase date; [On-Time Delivery % (by Delivery Date)] is the same KPI on the delivery-date role.
  formula: count(is_otd_eligible AND is_on_time) / count(is_otd_eligible)
  numerator: on-time orders
  denominator: OTD-eligible orders
  unit: percent
  source:
  - olist_orders delivery timestamps
  source_tag: PROPOSED (Olist columns CONFIRMED FACT from CSV headers; dbt names per 05 STTM, ASSUMPTION until models exist)
  fact_dependencies:
  - fct_deliveries
  dimension_dependencies:
  - dim_date
  - dim_seller
  - dim_geography
  grain: order
  refresh: daily batch after ingestion + dbt build
  owner: Head of Operations
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - exclude delivered orders missing delivered_customer_at (counted as DQ)
  - estimate is Olist's estimate, not a contractual SLA
  version: 1.0.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
    pr: TBD
  implementations:
    dbt: fct_deliveries.is_on_time
    sql: dbt_enterprise360/analyses/kpi_otd_rate.sql (reconciliation reference only)
    power_bi_dax: '[On-Time Delivery %]'
    streamlit: app/services/kpis.py → reads dbt mart; no recomputation
- id: KPI_DELIVERY_DAYS
  name: Average Delivery Days
  status: SUPPORTED
  definition: Mean days from purchase to customer delivery.
  formula: AVG(delivered_customer_at − purchased_at in days)
  numerator: Σ days
  denominator: delivered orders
  unit: days
  source:
  - olist_orders timestamps
  source_tag: PROPOSED (Olist columns CONFIRMED FACT from CSV headers; dbt names per 05 STTM, ASSUMPTION until models exist)
  fact_dependencies:
  - fct_deliveries
  dimension_dependencies:
  - dim_date
  - dim_seller
  - dim_geography
  grain: order
  refresh: daily batch after ingestion + dbt build
  owner: Head of Operations
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - delivered_customer_at >= purchased_at else flagged & excluded
  - timestamps local, no TZ (ASSUMPTION)
  version: 1.0.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
