    pr: TBD
  implementations:
    dbt: marts.mart_gmv_forecast (forecast_gmv, lower_gmv, upper_gmv, baseline_gmv, split, is_forecast); marts.mart_gmv_forecast_backtest (mae, smape_pct, n_months); produced by python -m analytics.forecast
    sql: (none; dbt authoritative)
