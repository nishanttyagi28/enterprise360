dataset: Olist Brazilian E-Commerce Public Dataset (Kaggle olistbr/brazilian-ecommerce)
currency: BRL
kpis:
- id: KPI_GMV
  name: Gross Merchandise Value
  status: SUPPORTED
  definition: Sum of item price over all order lines of orders in scope (all statuses). EXCLUDES freight. GMV is NOT recognized revenue (no invoicing/revenue-recognition, refunds, tax or returns ledger
    in Olist).
  formula: SUM(fct_order_items.item_price)
  numerator: —
  denominator: —
  unit: BRL
  source:
  - olist_order_items.price
  source_tag: PROPOSED (Olist columns CONFIRMED FACT from CSV headers; dbt names per 05 STTM, ASSUMPTION until models exist)
  fact_dependencies:
  - fct_order_items
  dimension_dependencies: &id001
  - dim_date
  - dim_customer
  - dim_product
  - dim_seller
  - dim_geography
  grain: order line (order_id, order_item_id)
  refresh: daily batch after ingestion + dbt build
  owner: Head of Sales
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - GMV must never be named or labelled 'Revenue' in any model, measure or visual
  - GMV >= KPI_NET_GMV for every period
  - sum(fct_order_items.item_price) == sum(stg_olist__order_items.item_price) (tolerance 0)
  - freight excluded; see KPI_GMV_INCL_FREIGHT
  version: 1.0.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
    pr: TBD
  implementations:
    dbt: fct_order_items.item_price
    sql: dbt_enterprise360/analyses/kpi_gmv.sql (reconciliation reference only)
    power_bi_dax: '[GMV]'
    streamlit: app/services/kpis.py → reads dbt mart; no recomputation
- id: KPI_GMV_INCL_FREIGHT
  name: GMV incl. Freight
  status: SUPPORTED
  definition: Item price + customer-charged freight. Not revenue.
  formula: SUM(item_price + freight_value)
  numerator: —
  denominator: —
  unit: BRL
  source:
  - olist_order_items.price
  - olist_order_items.freight_value
  source_tag: PROPOSED (Olist columns CONFIRMED FACT from CSV headers; dbt names per 05 STTM, ASSUMPTION until models exist)
  fact_dependencies:
  - fct_order_items
  dimension_dependencies: *id001
  grain: order line
  refresh: daily batch after ingestion + dbt build
  owner: Head of Sales
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - == KPI_GMV + KPI_FREIGHT (tolerance 0.00)
  version: 1.0.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
    pr: TBD
  implementations:
    dbt: fct_order_items
    sql: dbt_enterprise360/analyses/kpi_gmv_incl_freight.sql (reconciliation reference only)
    power_bi_dax: '[GMV incl Freight]'
    streamlit: app/services/kpis.py → reads dbt mart; no recomputation
- id: KPI_NET_GMV
  name: Net GMV (excl. canceled/unavailable)
  status: SUPPORTED
  definition: GMV of orders whose status is not canceled/unavailable. Operational proxy; NOT net revenue (no returns/refund data).
  formula: SUM(item_price) WHERE order_status NOT IN ('canceled','unavailable')
  numerator: —
  denominator: —
  unit: BRL
  source:
  - olist_order_items.price
  - olist_orders.order_status
  source_tag: PROPOSED (Olist columns CONFIRMED FACT from CSV headers; dbt names per 05 STTM, ASSUMPTION until models exist)
  fact_dependencies:
  - fct_order_items
  - fct_orders
  dimension_dependencies: *id001
  grain: order line
  refresh: daily batch after ingestion + dbt build
  owner: Head of Sales
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - <= KPI_GMV
  - label must say 'Net GMV' not 'Net Revenue'
  version: 1.0.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
    pr: TBD
  implementations:
    dbt: fct_order_items + fct_orders.is_canceled
    sql: dbt_enterprise360/analyses/kpi_net_gmv.sql (reconciliation reference only)
    power_bi_dax: '[Net GMV]'
    streamlit: app/services/kpis.py → reads dbt mart; no recomputation
- id: KPI_FREIGHT
  name: Freight Value
  status: SUPPORTED
  definition: Freight charged to customers on order lines (customer-paid; NOT carrier/logistics cost).
  formula: SUM(freight_value)
  numerator: —
  denominator: —
  unit: BRL
  source:
  - olist_order_items.freight_value
  source_tag: PROPOSED (Olist columns CONFIRMED FACT from CSV headers; dbt names per 05 STTM, ASSUMPTION until models exist)
  fact_dependencies:
  - fct_order_items
  dimension_dependencies: *id001
  grain: order line
  refresh: daily batch after ingestion + dbt build
  owner: Head of Operations
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - freight_value >= 0
  version: 1.0.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
    pr: TBD
  implementations:
    dbt: fct_order_items.freight_value
    sql: dbt_enterprise360/analyses/kpi_freight.sql (reconciliation reference only)
    power_bi_dax: '[Freight Value]'
    streamlit: app/services/kpis.py → reads dbt mart; no recomputation
- id: KPI_FREIGHT_SHARE
  name: Freight Share of GMV
  status: SUPPORTED
  definition: Freight as a share of item GMV.
  formula: KPI_FREIGHT / KPI_GMV
  numerator: KPI_FREIGHT
  denominator: KPI_GMV
  unit: ratio
  source:
  - olist_order_items
  source_tag: PROPOSED (Olist columns CONFIRMED FACT from CSV headers; dbt names per 05 STTM, ASSUMPTION until models exist)
  fact_dependencies:
  - fct_order_items
  dimension_dependencies: *id001
  grain: order line (ratio of sums)
  refresh: daily batch after ingestion + dbt build
  owner: Head of Operations
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - ratio of sums; never average of line ratios
  version: 1.0.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
    pr: TBD
  implementations:
    dbt: fct_order_items
    sql: dbt_enterprise360/analyses/kpi_freight_share.sql (reconciliation reference only)
    power_bi_dax: '[Freight Share %]'
    streamlit: app/services/kpis.py → reads dbt mart; no recomputation
- id: KPI_PAYMENT_VALUE
  name: Payment Value
  status: SUPPORTED
  definition: Sum of recorded payment values (all payment types incl. vouchers). Transaction value ≠ cash flow ≠ revenue.
  formula: SUM(fct_payments.payment_value)
  numerator: —
  denominator: —
  unit: BRL
  source:
  - olist_order_payments.payment_value
  source_tag: PROPOSED (Olist columns CONFIRMED FACT from CSV headers; dbt names per 05 STTM, ASSUMPTION until models exist)
  fact_dependencies:
  - fct_payments
  dimension_dependencies:
  - dim_date
  - dim_payment_type
  grain: payment (order_id, payment_sequential)
  refresh: daily batch after ingestion + dbt build
  owner: Finance
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - fct_payments never joined to fct_order_items (fan-out)
  - 'Per order: |sum(payment_value) − sum(item_price+freight_value)| <= 0.01 BRL else flagged (warn) — known exceptions: orders with payments but no items, vouchers, installment interest; exceptions counted
    in dq_results, not failed'
  version: 1.0.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
    pr: TBD
  implementations:
    dbt: fct_payments.payment_value
    sql: dbt_enterprise360/analyses/kpi_payment_value.sql (reconciliation reference only)
    power_bi_dax: '[Payment Value]'
    streamlit: app/services/kpis.py → reads dbt mart; no recomputation
- id: KPI_ORDERS
  name: Orders
  status: SUPPORTED
  definition: Distinct orders placed (all statuses).
  formula: COUNT(DISTINCT order_id)
  numerator: —
  denominator: —
  unit: count
  source:
  - olist_orders.order_id
  source_tag: PROPOSED (Olist columns CONFIRMED FACT from CSV headers; dbt names per 05 STTM, ASSUMPTION until models exist)
  fact_dependencies:
  - fct_orders
  dimension_dependencies: *id001
  grain: order
  refresh: daily batch after ingestion + dbt build
  owner: Head of Sales
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - order_id unique in fct_orders
  - count == distinct order_id in stg_olist__orders (tolerance 0)
  version: 1.0.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
    pr: TBD
  implementations:
    dbt: fct_orders
    sql: dbt_enterprise360/analyses/kpi_orders.sql (reconciliation reference only)
    power_bi_dax: '[Orders]'
    streamlit: app/services/kpis.py → reads dbt mart; no recomputation
- id: KPI_AOV
  name: Average Order Value
  status: SUPPORTED
  definition: Item GMV per order that has at least one item.
  formula: KPI_GMV / COUNT(DISTINCT order_id with items)
  numerator: KPI_GMV
  denominator: orders with ≥1 item
  unit: BRL
  source:
  - olist_order_items
  source_tag: PROPOSED (Olist columns CONFIRMED FACT from CSV headers; dbt names per 05 STTM, ASSUMPTION until models exist)
  fact_dependencies:
  - fct_order_items
  dimension_dependencies: *id001
  grain: order (non-additive)
  refresh: daily batch after ingestion + dbt build
  owner: Head of Sales
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - ratio of sums; never average of AOVs
  - denominator excludes orders with no items (e.g. some canceled/unavailable)
  version: 1.0.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
    pr: TBD
  implementations:
    dbt: fct_order_items
    sql: dbt_enterprise360/analyses/kpi_aov.sql (reconciliation reference only)
    power_bi_dax: '[AOV]'
    streamlit: app/services/kpis.py → reads dbt mart; no recomputation
- id: KPI_ITEMS_PER_ORDER
  name: Items per Order
  status: SUPPORTED
  definition: Average order lines (=units; one row per unit in Olist) per order with items.
  formula: COUNT(order lines)/COUNT(DISTINCT order_id)
  numerator: order lines
  denominator: orders with items
  unit: ratio
  source:
  - olist_order_items
  source_tag: PROPOSED (Olist columns CONFIRMED FACT from CSV headers; dbt names per 05 STTM, ASSUMPTION until models exist)
  fact_dependencies:
  - fct_order_items
  dimension_dependencies: *id001
  grain: order
  refresh: daily batch after ingestion + dbt build
  owner: Head of Sales
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - '>= 1'
  version: 1.0.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
    change: Olist-only scope; initial authoritative definition
    pr: TBD
  implementations:
    dbt: fct_order_items
    sql: dbt_enterprise360/analyses/kpi_items_per_order.sql (reconciliation reference only)
    power_bi_dax: '[Items per Order]'
    streamlit: app/services/kpis.py → reads dbt mart; no recomputation
- id: KPI_CANCEL_RATE
  name: Cancellation Rate
  status: SUPPORTED
  definition: Share of orders with status canceled or unavailable.
  formula: orders(status in canceled,unavailable)/KPI_ORDERS
  numerator: canceled+unavailable orders
  denominator: KPI_ORDERS
  unit: percent
  source:
  - olist_orders.order_status
  source_tag: PROPOSED (Olist columns CONFIRMED FACT from CSV headers; dbt names per 05 STTM, ASSUMPTION until models exist)
  fact_dependencies:
  - fct_orders
  dimension_dependencies:
  - dim_date
  - dim_customer
  - dim_geography
  grain: order
  refresh: daily batch after ingestion + dbt build
  owner: Head of Operations
  target: to be set by owner
  benchmark: to be set by owner
  validation_rules:
  - 0..1
  - order_status accepted_values test passes
  version: 1.0.0
  change_log:
  - version: 1.0.0
    date: '2026-10-30'
    author: KPI & Quality
