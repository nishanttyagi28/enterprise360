not_supported:
- kpis: Net/recognized revenue, Gross Profit, Gross Margin, Operating Profit/Margin, P&L, Cost per Order
  reason: No COGS, opex, invoicing, tax or GL in Olist
  handling: excluded; shown as 'not available from source'; never synthesized
- kpis: Target Achievement, Budget vs Actual, Budget Variance
  reason: No real targets/budgets; fabrication prohibited
  handling: excluded; shown as 'not available from source'; never synthesized
- kpis: CAC, ROAS, CTR, Marketing ROI
  reason: No marketing spend/impressions in Olist (Marketing Funnel has leads/deals only, separate dataset)
  handling: excluded; shown as 'not available from source'; never synthesized
- kpis: Return Rate / Refunds
  reason: No returns or refunds table
  handling: excluded; shown as 'not available from source'; never synthesized
- kpis: Inventory Turnover, Stockout, Fill Rate, Ageing
  reason: No inventory or stock data
  handling: excluded; shown as 'not available from source'; never synthesized
- kpis: Supplier/procurement KPIs (PPV, lead time, POs)
  reason: Sellers are marketplace merchants, not suppliers; no POs
  handling: excluded; shown as 'not available from source'; never synthesized
- kpis: Headcount, Attrition, Absenteeism, Hiring, Payroll
  reason: No HR data in Olist
  handling: excluded; shown as 'not available from source'; never synthesized
- kpis: Cash flow, AR/AP, Collections
  reason: Payments are transaction values, not cash settlement
  handling: excluded; shown as 'not available from source'; never synthesized
- kpis: Complaint Resolution Time
  reason: No complaint/ticket data; reviews are not tickets
  handling: excluded; shown as 'not available from source'; never synthesized
- kpis: Margin-based CLV
  reason: No cost data; revenue-based CLV would need explicit 'GMV-based' label
  handling: excluded; shown as 'not available from source'; never synthesized
