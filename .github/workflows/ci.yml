name: ci
on:
  push:
  pull_request:

jobs:
  lint-type-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: enterprise360_ci
          POSTGRES_USER: e360_app
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U e360_app -d enterprise360_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: enterprise360_ci
      # Destructive integration tests need a dedicated DB, distinct from POSTGRES_DB (the test guard refuses the main one).
      E360_TEST_DB: enterprise360_ci_test
      POSTGRES_USER: e360_app
      POSTGRES_PASSWORD: ci-only-password
      E360_OLIST_DIR: tests/fixtures/olist
      E360_UCI_DIR: tests/fixtures/uci
      E360_FUNNEL_DIR: tests/fixtures/funnel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check ingestion orchestration tests
          ruff format --check ingestion orchestration
      - name: Mypy
        run: mypy
      - name: Ingest fixtures
        run: |
          python -m ingestion init-db
          python -m ingestion olist
          python -m ingestion uci
          python -m ingestion funnel
      - name: dbt deps + build (fixtures)
        run: |
          python -m orchestration.dbt_runner deps
          python -m orchestration.dbt_runner build
      - name: Create dedicated test database
        env:
          PGPASSWORD: ci-only-password
        run: psql -h localhost -U e360_app -d enterprise360_ci -v ON_ERROR_STOP=1 -c "create database enterprise360_ci_test"
      - name: Pytest (unit + integration)
        run: python -m pytest
